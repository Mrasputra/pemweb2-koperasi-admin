<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simpanan — KSP Amanah Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="simpanan">
  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand"><div class="sidebar__title">KSP Amanah Digital</div></div>
      <nav class="nav">
        <a href="dashboard.html" class="nav__link" data-nav="dashboard">Dashboard</a>
        <div class="nav__group is-open">
          <button type="button" class="nav__group-toggle" aria-expanded="true">Transaksi</button>
          <div class="nav__sub"><a href="simpanan.html" class="nav__sublink" data-nav="simpanan">Simpanan</a><a href="pinjaman.html" class="nav__sublink" data-nav="pinjaman">Pinjaman</a></div>
        </div>
      </nav>
    </aside>
    <div class="main-wrap">
      <header class="header">
        <button type="button" class="header__menu-btn" id="menuToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <nav class="breadcrumb"><a href="dashboard.html">KSP Amanah</a><span class="breadcrumb__sep">›</span><span class="breadcrumb__current">Transaksi Simpanan</span></nav>
      </header>
      <main class="content">
        <div class="page-head">
          <div><h1 class="page-head__title">Transaksi Simpanan</h1></div>
          <div class="page-head__actions no-print">
            <button type="button" class="btn btn--primary" id="btnTambahSimpanan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              Tambah Simpanan
            </button>
          </div>
        </div>
        <section class="glass-panel table-panel">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Anggota</th>
                  <th>Jenis</th>
                  <th>Jumlah</th>
                  <th>Tanggal</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="simpananTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
      <footer class="page-footer"><span>© 2024 KSP Amanah Digital</span></footer>
    </div>
  </div>

  <div class="modal-backdrop" id="formModalSimpanan" role="dialog" aria-modal="true" aria-labelledby="formModalSimpananTitle" aria-hidden="true">
    <div class="glass-panel modal modal--form">
      <h2 class="modal__title" id="formModalSimpananTitle">Tambah Simpanan</h2>
      <p class="modal__text">Catat setoran anggota ke kas koperasi.</p>
      <form id="formSimpanan" novalidate>
        <div class="form-group">
          <label class="form-label" for="simpanan_id_anggota">Anggota <span>*</span></label>
          <select class="form-select" id="simpanan_id_anggota" name="simpanan_id_anggota" required>
            <option value="">Pilih anggota aktif</option>
          </select>
          <span class="form-error" data-error="simpanan_id_anggota"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="simpanan_jenis">Jenis <span>*</span></label>
          <select class="form-select" id="simpanan_jenis" name="simpanan_jenis" required>
            <option value="">Pilih jenis</option>
            <option value="Pokok">Pokok</option>
            <option value="Wajib">Wajib</option>
            <option value="Sukarela">Sukarela</option>
          </select>
          <span class="form-error" data-error="simpanan_jenis"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="simpanan_jumlah">Jumlah <span>*</span></label>
          <input class="form-input" type="text" inputmode="numeric" id="simpanan_jumlah" name="simpanan_jumlah" placeholder="Contoh: 150.000" required>
          <span class="form-error" data-error="simpanan_jumlah"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="simpanan_tanggal">Tanggal <span>*</span></label>
          <input class="form-input" type="date" id="simpanan_tanggal" name="simpanan_tanggal" required>
          <span class="form-error" data-error="simpanan_tanggal"></span>
        </div>
        <div class="modal__actions" style="margin-top: 0.5rem;">
          <button type="button" class="btn btn--ghost btn--sm" id="formModalSimpananCancel">Batal</button>
          <button type="submit" class="btn btn--primary btn--sm">Simpan</button>
        </div>
      </form>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="script.js"></script>
</body>
</html>
