<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinjaman — KSP Amanah Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="pinjaman">
  <div class="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand"><div class="sidebar__title">KSP Amanah Digital</div></div>
      <nav class="nav">
        <a href="dashboard.html" class="nav__link" data-nav="dashboard">Dashboard</a>
        <div class="nav__group is-open">
          <button type="button" class="nav__group-toggle" aria-expanded="true">Transaksi</button>
          <div class="nav__sub"><a href="simpanan.html" class="nav__sublink" data-nav="simpanan">Simpanan</a><a href="pinjaman.html" class="nav__sublink" data-nav="pinjaman">Pinjaman</a></div>
        </div>
      </nav>
    </aside>
    <div class="main-wrap">
      <header class="header">
        <button type="button" class="header__menu-btn" id="menuToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <nav class="breadcrumb"><a href="dashboard.html">KSP Amanah</a><span class="breadcrumb__sep">›</span><span class="breadcrumb__current">Transaksi Pinjaman</span></nav>
      </header>
      <main class="content">
        <div class="page-head">
          <div><h1 class="page-head__title">Transaksi Pinjaman</h1></div>
          <div class="page-head__actions no-print">
            <button type="button" class="btn btn--primary" id="btnAjukanPinjaman">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              Ajukan Pinjaman
            </button>
          </div>
        </div>
        <section class="glass-panel table-panel">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Anggota</th>
                  <th>Jumlah Pinjam</th>
                  <th>Tenor</th>
                  <th>Tgl. Pinjam</th>
                  <th>Sisa Angsuran</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="pinjamanTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
      <footer class="page-footer"><span>© 2024 KSP Amanah Digital</span></footer>
    </div>
  </div>

  <div class="modal-backdrop" id="formModalPinjaman" role="dialog" aria-modal="true" aria-labelledby="formModalPinjamanTitle" aria-hidden="true">
    <div class="glass-panel modal modal--form">
      <h2 class="modal__title" id="formModalPinjamanTitle">Ajukan Pinjaman</h2>
      <p class="modal__text">Catat pengajuan pinjaman anggota. Status awal: Lancar.</p>
      <form id="formPinjaman" novalidate>
        <div class="form-group">
          <label class="form-label" for="pinjaman_id_anggota">Anggota <span>*</span></label>
          <select class="form-select" id="pinjaman_id_anggota" name="pinjaman_id_anggota" required>
            <option value="">Pilih anggota aktif</option>
          </select>
          <span class="form-error" data-error="pinjaman_id_anggota"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="pinjaman_jumlah">Jumlah Pinjaman <span>*</span></label>
          <input class="form-input" type="text" inputmode="numeric" id="pinjaman_jumlah" name="pinjaman_jumlah" placeholder="Contoh: 5.000.000" required>
          <span class="form-error" data-error="pinjaman_jumlah"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="pinjaman_tenor">Tenor (bulan) <span>*</span></label>
          <input class="form-input" type="number" id="pinjaman_tenor" name="pinjaman_tenor" min="1" placeholder="Contoh: 12" required>
          <span class="form-error" data-error="pinjaman_tenor"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="pinjaman_tgl">Tanggal Pinjam <span>*</span></label>
          <input class="form-input" type="date" id="pinjaman_tgl" name="pinjaman_tgl" required>
          <span class="form-error" data-error="pinjaman_tgl"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="pinjaman_sisa">Sisa Angsuran</label>
          <input class="form-input" type="text" id="pinjaman_sisa" name="pinjaman_sisa" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <input class="form-input" type="text" value="Lancar" readonly>
        </div>
        <div class="modal__actions" style="margin-top: 0.5rem;">
          <button type="button" class="btn btn--ghost btn--sm" id="formModalPinjamanCancel">Batal</button>
          <button type="submit" class="btn btn--primary btn--sm">Simpan</button>
        </div>
      </form>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="script.js"></script>
</body>
</html>
